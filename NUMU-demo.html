<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Nunito:wght@900&family=Noto+Kufi+Arabic:wght@600&display=swap');

:root {
  --bg: #F3F6F3; --panel: #FFFFFF; --ink: #12352A; --muted: #56675F; --line: #DCE5DF;
  --orange: #3FAE5F; --orange-deep: #1E7A48; --orange-soft: #E3F3E6; --orange-mid: #A6DBAF;
  --maroon: #8A5A00; --green: #0B7A53; --green-soft: #E3F4EC; --red: #C62839; --red-soft: #FCE6E8;
  --display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif; --body: 'Figtree', system-ui, sans-serif;
  --r-sm: 8px; --r: 14px; --r-lg: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.01em; line-height: 1.15; }
h1 { font-size: clamp(26px, 3vw, 34px); font-weight: 800; }
h2 { font-size: 18px; font-weight: 700; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: not-allowed; }
svg { flex-shrink: 0; }
:focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; margin-top: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 99; }
.skip-link:focus { left: 8px; }
.up { color: var(--green); } .down { color: var(--red); }

/* Brand */
.brand { display: flex; align-items: center; gap: 9px; }
.wordmark { font-family: 'Nunito', var(--body); font-weight: 900; font-size: 24px; letter-spacing: 0.02em; color: var(--ink); }
.brand-ar { font-family: 'Noto Kufi Arabic', sans-serif; font-size: 13px; color: var(--orange-deep); margin-left: 2px; }

/* Buttons and small parts */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--orange-deep); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #17663B; }
.btn-primary:disabled { background: #DFE7E2; color: #7D8F86; }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover { background: #1D4A3B; }
.btn-ghost { background: var(--panel); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn.wide { width: 100%; }
.link { color: var(--orange-deep); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.link:hover { color: var(--ink); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--ink); }
.icon-btn:hover { background: var(--orange-soft); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--orange-soft); color: var(--orange-deep); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.tag.strong { background: var(--ink); color: #fff; }
.tag.good { background: var(--green-soft); color: var(--green); }
.avatar { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--orange-deep); color: #fff; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.avatar.sm { width: 28px; height: 28px; font-size: 11px; background: var(--orange-soft); color: var(--ink); }
.avatar.lg { width: 56px; height: 56px; font-size: 19px; }
.change { display: inline-block; min-width: 72px; text-align: right; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 6px; }
.change.up { background: var(--green-soft); color: var(--green); }
.change.down { background: var(--red-soft); color: var(--red); }
.change.flat { background: #EEE; color: var(--muted); }
.ticker-mark { display: inline-grid; place-items: center; width: 54px; height: 40px; border-radius: 10px; background: var(--panel); border: 1.5px solid var(--line); box-shadow: inset 0 -4px 0 var(--sector); font-weight: 800; font-size: 11.5px; letter-spacing: .02em; color: var(--ink); flex-shrink: 0; }
.bar { height: 8px; border-radius: 99px; background: #E1E9E3; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--orange); border-radius: 99px; transition: width .4s; }
.bar.light { background: rgba(255,255,255,.18); margin-top: 12px; max-width: 320px; }

/* Shell */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 28px; padding: 26px 18px; background: var(--panel); border-right: 1px solid var(--line); }
.sidebar .brand { padding: 0 8px; }
.side-nav { display: grid; gap: 4px; }
.nav-link { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; font-weight: 600; color: var(--muted); }
.nav-link span { flex: 1; }
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link.is-active { background: var(--orange-soft); color: var(--ink); box-shadow: inset 4px 0 0 var(--orange-deep); }
.side-bottom { margin-top: auto; display: grid; gap: 10px; }
.level-card { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; }
.level-card:hover { background: var(--bg); }
.level-card strong { display: block; font-size: 14px; } .level-card small { color: var(--muted); }
.points-card { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; border-radius: var(--r); background: var(--ink); color: #fff; }
.points-card span { font-size: 13px; color: #CDE3D5; }
.points-card strong { font-family: var(--display); font-size: 24px; color: #9FE0A9; }
.side-note { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); padding: 0 8px; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; justify-content: flex-end; align-items: center; padding: 16px clamp(16px, 4vw, 40px) 0; }
.mobile-brand { display: none; align-items: center; gap: 8px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.streak { display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; color: var(--orange-deep); }
.page { width: 100%; max-width: 1180px; padding: 18px clamp(16px, 4vw, 40px) 48px; outline: none; }
.foot { margin-top: auto; padding: 18px clamp(16px, 4vw, 40px) 28px; color: var(--muted); font-size: 12.5px; }
.bottom-nav { display: none; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.lede { color: var(--muted); margin-top: 6px; max-width: 62ch; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.panel h2 + .table { margin-top: 12px; }

/* Home: today's route (the one bold element) */
.route { background: #1E7A48; border-radius: var(--r-lg); padding: clamp(22px, 3vw, 34px); color: #fff; margin-bottom: 22px; }
.route .btn-ink { background: #fff; color: var(--ink); }
.route .btn-ink:hover { background: #E3F3E6; }
.route-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.route-kicker { font-weight: 600; font-size: 15px; }
.route h1 { font-size: clamp(34px, 5vw, 56px); letter-spacing: -0.03em; margin-top: 2px; }
.route-count { font-weight: 800; font-family: var(--display); font-size: 17px; }
.route-track { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); margin: 22px 0 6px; overflow: hidden; }
.route-track span { display: block; height: 100%; background: #9FE0A9; border-radius: 99px; transition: width .5s; }
.route-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.route-steps li { position: relative; padding: 18px 22px 4px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.route-steps li + li { padding-left: 22px; border-left: 1.5px solid rgba(255, 255, 255, .25); }
.step-dot { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; font-weight: 800; font-family: var(--display); margin-bottom: 4px; }
.route-steps .is-done .step-dot { background: #9FE0A9; border-color: #9FE0A9; color: var(--ink); }
.route-steps h2 { font-size: 21px; font-weight: 800; }
.route-steps p { font-size: 14.5px; max-width: 30ch; }
.route-steps small { font-weight: 700; font-size: 13px; opacity: .85; }
.route-steps .btn { margin-top: 8px; }
.home-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
.mini-path { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 2px; }
.mini-path button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; text-align: left; font-weight: 600; }
.mini-path button:hover { background: var(--bg); }
.mini-path button span:nth-child(2) { flex: 1; }
.mini-path small { color: var(--muted); }
.node { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--orange-mid); color: var(--ink); flex-shrink: 0; background: var(--panel); }
.is-done .node { background: var(--orange-deep); border-color: var(--orange-deep); color: #fff; }
.reward { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13.5px; color: var(--maroon); }
.mini-board { list-style: none; padding: 0; margin: 10px 0 0; }
.mini-board li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.mini-board li:last-child { border: 0; }
.mini-board .who { flex: 1; font-weight: 600; }
.mini-board .rank { width: 18px; font-weight: 800; color: var(--muted); }
.mini-board .is-you { background: var(--orange-soft); border-radius: 10px; border-color: transparent; }
.term h2 { font-size: 15px; color: var(--muted); font-family: var(--body); font-weight: 600; }
.term-word { font-family: var(--display); font-size: 30px; font-weight: 800; margin: 6px 0 8px; color: var(--maroon); }
.term p:not(.term-word) { margin-bottom: 12px; max-width: 46ch; }
.index-line { display: flex; align-items: center; gap: 12px; margin: 10px 0 8px; font-weight: 600; }
.index-line strong { font-family: var(--display); font-size: 22px; margin-left: auto; }
.movers { list-style: none; padding: 0; margin: 0 0 12px; }
.movers button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 0; text-align: left; font-weight: 600; }
.movers button span:nth-child(2) { flex: 1; }

/* Learn */
.xp-chip { display: inline-flex; gap: 8px; align-items: center; padding: 9px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; }
.xp-chip svg { color: #9FE0A9; }
.overall { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; font-weight: 700; font-size: 14px; }
.overall .bar { flex: 1; max-width: 420px; }
.units { display: grid; gap: 18px; }
.unit { display: grid; grid-template-columns: 300px 1fr; gap: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px; }
.unit-no { font-weight: 800; color: var(--orange-deep); font-size: 13.5px; }
.unit-head h2 { font-size: 26px; font-weight: 800; margin: 4px 0 8px; }
.unit-head p { color: var(--muted); }
.unit-head .unit-reward { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: var(--maroon); font-weight: 700; font-size: 13.5px; }
.unit.is-locked { background: transparent; border-style: dashed; }
.unit.is-locked .unit-head h2, .unit.is-locked .path { opacity: .55; }
.path { list-style: none; padding: 0; margin: 0; position: relative; }
.path::before { content: ''; position: absolute; left: 21px; top: 26px; bottom: 26px; width: 3px; background: var(--orange-soft); border-radius: 3px; }
.path li { position: relative; }
.path button { width: 100%; display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 4px; border-radius: 14px; text-align: left; }
.path button:hover:not(:disabled) { background: var(--bg); }
.path .node { width: 38px; height: 38px; border-width: 3px; position: relative; z-index: 1; }
.path .is-current .node { border-color: var(--orange-deep); box-shadow: 0 0 0 5px var(--orange-soft); }
.path .is-current button { background: #F1FAF2; }
.path-text { flex: 1; } .path-text strong { display: block; font-size: 15.5px; } .path-text small { color: var(--muted); }
.path-meta { font-size: 13px; font-weight: 700; color: var(--muted); }
.path .is-done .path-meta { color: var(--green); }

/* Lesson player */
.player-modal { max-width: 620px; }
.segs { display: flex; gap: 5px; margin-bottom: 22px; }
.segs span { flex: 1; height: 6px; border-radius: 9px; background: #E1E9E3; }
.segs .done { background: var(--orange-deep); } .segs .now { background: var(--ink); }
.step-label { display: block; font-size: 13px; font-weight: 700; color: var(--orange-deep); margin-bottom: 8px; }
.card-step h3 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
.card-step p { font-size: 16.5px; line-height: 1.6; max-width: 60ch; }
.example { display: flex; gap: 12px; margin-top: 18px; padding: 14px 16px; background: var(--orange-soft); border-radius: var(--r); }
.example svg { color: var(--orange-deep); margin-top: 3px; }
.example p { font-size: 15px; }
.term-box { margin-top: 14px; padding: 12px 16px; border-left: 4px solid var(--maroon); background: #FBF5E6; border-radius: 0 10px 10px 0; display: grid; gap: 2px; font-size: 14.5px; }
.player-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 24px; }
.quiz { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.quiz legend { font-family: var(--display); font-weight: 700; font-size: 21px; margin-bottom: 14px; line-height: 1.3; }
.option { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 600; background: var(--panel); }
.option:hover:not(:disabled) { border-color: var(--ink); }
.option.is-chosen { border-color: var(--orange-deep); background: var(--orange-soft); }
.option.is-right { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.option.is-wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.option:disabled { cursor: default; }
.feedback { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; }
.feedback.right { background: var(--green-soft); } .feedback.wrong { background: var(--red-soft); }
.player-done { text-align: center; padding: 10px 0; }
.player-done h3 { font-size: 28px; font-weight: 800; margin: 14px 0 6px; }
.done-art, .unlock-art { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--orange-deep); color: #fff; }
.unlock-art { background: var(--ink); color: #9FE0A9; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
.score-line { font-weight: 700; margin-top: 8px; }
.takeaway { text-align: left; margin-top: 20px; padding: 16px; border-radius: var(--r); background: var(--bg); }
.takeaway strong { color: var(--orange-deep); }
.player-done .player-actions { justify-content: center; }

/* Markets and picker */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tool-right { display: flex; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; }
.chip:hover { border-color: var(--ink); }
.chip.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; width: 190px; color: var(--ink); }
select, input[type="text"], input:not([type]), input[type="search"] { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
select { height: 40px; padding: 0 12px; border-radius: 999px; font-weight: 600; }
.explainer { display: flex; gap: 14px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--orange-deep); border-radius: var(--r); margin-bottom: 16px; }
.explainer svg { color: var(--orange-deep); }
.explainer p { margin: 4px 0 8px; max-width: 75ch; }
.stock-list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stock-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.stock-row:last-child { border: 0; }
.stock-row.is-picked { background: #F1FAF2; }
.stock-main { flex: 1; display: flex; align-items: center; gap: 14px; text-align: left; min-width: 0; }
.stock-name { min-width: 0; } .stock-name strong { display: block; } .stock-name small { color: var(--muted); }
.stock-price { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.pick-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ink); font-weight: 700; font-size: 13.5px; min-width: 92px; justify-content: center; }
.pick-btn:hover { background: var(--orange-soft); }
.pick-btn.is-on { background: var(--orange-deep); border-color: var(--orange-deep); color: #fff; }
.empty { padding: 36px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 10px; background: var(--panel); border-radius: var(--r); }
.stock-modal { max-width: 640px; }
.stock-detail-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.stock-detail-top .ticker-mark { width: 70px; height: 52px; font-size: 14px; }
.big-price { font-family: var(--display); font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.facts { display: grid; gap: 14px; margin: 0; }
.facts dt { font-weight: 700; font-size: 13.5px; color: var(--orange-deep); }
.facts dd { margin: 2px 0 0; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.metrics > div { padding: 14px; border-radius: 12px; background: var(--bg); display: grid; gap: 2px; align-content: start; }
.metrics span { font-size: 13px; color: var(--muted); font-weight: 600; }
.metrics strong { font-family: var(--display); font-size: 22px; }
.metrics small { color: var(--muted); font-size: 12.5px; }
.metrics .link { font-size: 13px; justify-self: start; margin-top: 4px; }

/* Compete */
.gate { display: flex; align-items: center; gap: 20px; padding: 22px 24px; border-radius: var(--r-lg); background: var(--ink); color: #fff; margin-bottom: 18px; flex-wrap: wrap; }
.gate > div:nth-child(2) { flex: 1; min-width: 240px; }
.gate h2 { font-size: 20px; } .gate p { color: #CDE3D5; margin-top: 4px; }
.gate-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: #9FE0A9; color: var(--ink); }
.how { list-style: none; counter-reset: how; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0; margin: 0 0 18px; }
.how li { counter-increment: how; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); font-size: 14px; }
.how li::before { content: counter(how); grid-row: span 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--orange-soft); color: var(--orange-deep); font-weight: 800; }
.how span { color: var(--muted); }
.pick-layout { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
.tray { position: sticky; top: 16px; background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r-lg); padding: 20px; }
.tray h2 { display: flex; justify-content: space-between; align-items: baseline; }
.tray h2 span { font-family: var(--body); font-size: 14px; color: var(--muted); }
.slots { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
.slots li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--bg); min-height: 58px; }
.slots li > span { flex: 1; min-width: 0; } .slots strong { display: block; font-size: 14px; } .slots small { color: var(--muted); }
.slots .empty-slot { justify-content: center; border: 2px dashed var(--orange-mid); background: transparent; color: var(--orange-deep); font-weight: 700; }
.mix { display: flex; gap: 8px; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: #FBF5E6; color: var(--maroon); margin-bottom: 12px; }
.mix.good { background: var(--green-soft); color: var(--green); }
.mix svg { margin-top: 2px; }
.pick-cards { list-style: none; padding: 0; margin: 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pick-cards li { display: grid; gap: 6px; justify-items: start; padding: 16px; border-radius: var(--r); background: var(--bg); }
.pick-cards li > span:last-child { font-size: 13px; color: var(--muted); }
.locked .player-actions { justify-content: flex-start; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; margin-bottom: 18px; }
.result-hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.result-hero > div { padding: 18px; border-radius: var(--r); background: var(--bg); }
.result-hero > div:first-child { background: var(--ink); color: #fff; }
.result-hero p { font-size: 13.5px; font-weight: 600; opacity: .8; }
.result-hero strong { font-family: var(--display); font-size: 38px; font-weight: 800; letter-spacing: -0.02em; }
.result-hero > div:first-child .up { color: #6FE0AE; } .result-hero > div:first-child .down { color: #FF8A96; }
.result-hero small { font-size: 16px; font-weight: 600; color: var(--muted); }
.sub { margin: 20px 0 10px; }
.lessons-learned { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.lessons-learned li { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); }
.lessons-learned svg { color: var(--orange-deep); margin-top: 2px; }
.lessons-learned p { margin: 2px 0 6px; color: var(--muted); }
.result .player-actions { justify-content: flex-start; }
.reason-modal { max-width: 560px; }
.reason-set { border: 0; padding: 0; margin: 16px 0 0; }
.reason-set legend { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 8px; }
.reason-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.reason { position: relative; }
.reason input { position: absolute; opacity: 0; }
.reason span { display: inline-block; padding: 8px 13px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13.5px; font-weight: 600; cursor: pointer; }
.reason input:checked + span { background: var(--orange-deep); border-color: var(--orange-deep); color: #fff; }
.reason input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
.form-error { color: var(--red); font-weight: 600; font-size: 13.5px; min-height: 20px; margin: 10px 0; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
.table tr:last-child td { border: 0; }

/* Leaderboard */
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.seg button { padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg .is-on { background: var(--orange-deep); color: #fff; }
.invite { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--r); background: var(--orange-soft); margin-bottom: 16px; flex-wrap: wrap; }
.invite span { flex: 1; }
.podium { list-style: none; display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 10px 0 0; margin: 0 0 18px; }
.podium li { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 150px; text-align: center; }
.podium li > span:not(.avatar) { font-size: 13px; color: var(--muted); font-weight: 600; }
.podium .block { width: 100%; margin-top: 8px; display: grid; place-items: center; border-radius: 14px 14px 0 0; font-family: var(--display); font-weight: 800; font-size: 28px; }
.place-1 .block { height: 110px; background: var(--orange-deep); color: #fff; }
.place-2 .block { height: 80px; background: var(--orange); }
.place-3 .block { height: 60px; background: var(--orange-mid); }
.podium .is-you .avatar { box-shadow: 0 0 0 3px var(--ink); }
.board { background: var(--panel); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; }
.board td:first-child { font-weight: 800; width: 44px; }
.board .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.board tr.is-you td { background: var(--orange-soft); }
.how-points { margin-top: 18px; }
.how-points ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; }

/* Modal, toast */
.backdrop { position: fixed; inset: 0; background: rgba(18, 53, 42, .45); display: grid; place-items: center; padding: 16px; z-index: 50; overflow-y: auto; }
.modal { width: 100%; max-width: 520px; background: var(--panel); border-radius: var(--r-lg); box-shadow: 0 24px 60px rgba(18, 53, 42, .3); max-height: calc(100vh - 32px); overflow-y: auto; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 22px 0; }
.modal-head h2 { font-size: 20px; }
.modal-body { padding: 18px 22px 24px; }
.modal-body label { display: block; font-weight: 700; margin-bottom: 8px; }
.modal-body input:not([type="radio"]) { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; }
body.modal-open { overflow: hidden; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; }
.toast svg { color: #9FE0A9; }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

/* Profile and notifications */
.profile-top { display: flex; gap: 14px; align-items: center; }
.profile-top h3 { font-size: 22px; }
.level-bar { margin: 16px 0; display: grid; gap: 6px; } .level-bar small { color: var(--muted); font-weight: 600; }
.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.profile-stats div { padding: 12px; background: var(--bg); border-radius: 12px; display: grid; }
.profile-stats strong { font-family: var(--display); font-size: 22px; } .profile-stats span { font-size: 12.5px; color: var(--muted); }
.profile h4 { margin: 20px 0 10px; font-size: 16px; }
.badges { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badges li { padding: 12px; border-radius: 12px; border: 1px dashed var(--line); display: grid; gap: 2px; color: var(--muted); }
.badges li strong { font-size: 13.5px; } .badges li small { font-size: 11.5px; line-height: 1.35; }
.badges .is-earned { border: 1px solid var(--orange-mid); background: var(--orange-soft); color: var(--ink); }
.badges .is-earned svg { color: var(--orange-deep); }
.profile-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
.notif { display: grid; gap: 12px; }
.notif-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 12px; background: var(--bg); }
.notif-row > div { flex: 1; } .notif-row p { color: var(--muted); font-size: 14px; }
.switch { width: 46px; height: 28px; border-radius: 99px; background: #C9D4CD; position: relative; flex-shrink: 0; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; }
.switch[aria-checked="true"] { background: var(--orange-deep); }
.switch[aria-checked="true"] span { left: 21px; }

/* Responsive */
/* Agents */
.agents-layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
.agent-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.agent-card { width: 100%; display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border-radius: var(--r); background: var(--panel); border: 1.5px solid var(--line); }
.agent-card:hover { border-color: var(--ink); }
.agent-card.is-on { border-color: var(--orange-deep); background: var(--orange-soft); }
.agent-card strong { display: block; font-family: var(--display); font-size: 16.5px; }
.agent-card small { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: block; margin-top: 2px; }
.agent-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: #9FE0A9; flex-shrink: 0; }
.chat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 560px; overflow: hidden; }
.chat-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.chat-head > div { flex: 1; } .chat-head p { color: var(--muted); font-size: 13.5px; }
.chat-log { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 520px; background: #FAFCFA; }
.chat-empty { margin: auto; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 10px; max-width: 34ch; }
.chat-empty svg { color: var(--orange-deep); }
.msg { max-width: 82%; padding: 12px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.55; }
.msg.you { align-self: flex-end; background: var(--orange-deep); color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.agent ul { margin: 8px 0; padding-left: 18px; }
.msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.typing { display: flex; gap: 5px; padding: 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }
.prompts { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px 0; }
.prompts .chip { font-size: 13px; }
.chat-input { display: flex; gap: 10px; padding: 14px 20px 20px; }
.chat-input input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); }
.coach-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; }

@media (max-width: 1080px) {
  .agents-layout { grid-template-columns: 1fr; }
  .agent-list { grid-template-columns: 1fr 1fr; }
  .pick-layout { grid-template-columns: 1fr; }
  .tray { position: sticky; bottom: 76px; top: auto; z-index: 5; box-shadow: 0 -8px 30px rgba(18, 53, 42, .12); order: -1; }
  .unit { grid-template-columns: 1fr; gap: 16px; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { justify-content: space-between; padding-top: 12px; }
  .mobile-brand { display: flex; }
  .mobile-brand .wordmark { font-size: 21px; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav .nav-link { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11px; border-radius: 10px; box-shadow: none; }
  .bottom-nav .nav-link.is-active { background: var(--orange-soft); }
  .main-col { padding-bottom: 72px; }
  .home-grid, .route-steps, .how, .pick-cards, .result-hero, .metrics { grid-template-columns: 1fr; }
  .route-steps li + li { padding-left: 0; border-left: 0; border-top: 1.5px solid rgba(255, 255, 255, .25); }
  .route-steps li { padding-right: 0; padding-bottom: 14px; }
  .stock-row { flex-wrap: wrap; gap: 10px; }
  .stock-main { flex-basis: 100%; }
  .stock-price { min-width: 0; text-align: left; flex: 1; }
  .search input { width: 100%; }
  .board th:nth-child(3), .board td:nth-child(3), .board th:nth-child(4), .board td:nth-child(4) { display: none; }
  .badges { grid-template-columns: 1fr 1fr; }
  .agent-list { grid-template-columns: 1fr 1fr; gap: 8px; }
  .agent-card { padding: 12px; gap: 10px; align-items: center; }
  .agent-card small { display: none; }
  .agent-card .agent-icon { width: 36px; height: 36px; }
  .chat-input, .prompts, .chat-head, .chat-log { padding-left: 14px; padding-right: 14px; }
  .chat { min-height: 480px; }
  .msg { max-width: 92%; }
  .podium li { width: 30%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Entry screen for the NUMU demo. */
.entry { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.entry-top { display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(16px, 5vw, 56px); }
.entry-main { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; padding: 20px clamp(16px, 5vw, 56px) 56px; max-width: 1240px; width: 100%; margin: 0 auto; outline: none; }
.entry-story h1 { font-size: clamp(38px, 5.6vw, 68px); letter-spacing: -0.035em; line-height: 1.02; max-width: 13ch; }
.entry-story > p { font-size: 18px; color: var(--muted); margin-top: 18px; max-width: 48ch; }
.entry-steps { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 0; max-width: 460px; }

.entry-steps li > span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--orange-deep); color: #fff; font-family: var(--display); font-weight: 800; font-size: 17px; }
.entry-steps li:nth-child(2) > span { background: var(--orange); color: var(--ink); }
.entry-steps li:nth-child(3) > span { background: var(--orange-mid); color: var(--ink); }
.entry-steps strong { display: block; font-family: var(--display); font-size: 18px; }
.entry-steps small { color: var(--muted); font-size: 14px; }
.entry-card { background: #1E7A48; color: #fff; border-radius: 28px; padding: clamp(24px, 4vw, 40px); }
.entry-card h2 { font-size: 30px; font-weight: 800; margin-bottom: 20px; }
.entry-card label { display: block; font-weight: 700; margin-bottom: 8px; }
.entry-card input { width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-size: 16px; margin-bottom: 14px; }
.entry-card .btn-primary { background: #fff; color: var(--ink); min-height: 52px; font-size: 16px; }
.entry-card .btn-primary:hover { background: #E3F3E6; }
.entry-card .fine { color: #fff; opacity: .85; }
.entry-story > .entry-tagline { margin-top: 0; font-size: 16px;  font-weight: 700; color: var(--orange-deep); margin-bottom: 14px; }
@media (max-width: 860px) { .entry-main { grid-template-columns: 1fr; } }
.entry-steps li:nth-child(4) > span { background: var(--ink); color: #9FE0A9; }

/* Login and sign-up */
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, .14); margin-bottom: 22px; }
.auth-tabs button { padding: 10px 12px; border-radius: 999px; font-weight: 700; color: #fff; }
.auth-tabs .is-on { background: #fff; color: var(--ink); }
.entry-card .field { margin-bottom: 14px; }
.entry-card .field input { margin-bottom: 0; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.text-btn { color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.text-btn:hover { color: #C9F0CF; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 76px; }
.pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--ink); background: #E3F3E6; }
.entry-card input[aria-invalid="true"] { border-color: #FFB3BC; box-shadow: 0 0 0 3px rgba(255, 179, 188, .45); }
.field-error { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-weight: 700; font-size: 13.5px; color: #FFE0E4; }
.check { display: flex !important; gap: 10px; align-items: flex-start; font-weight: 500 !important; font-size: 14px; margin: 4px 0 16px; cursor: pointer; }
.check input { width: 18px !important; height: 18px !important; margin: 2px 0 0 !important; accent-color: var(--ink); flex-shrink: 0; }
.check + .field-error { margin: -10px 0 14px; }
.auth-notice { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .16); font-size: 14px; margin-bottom: 14px; }
.switch-line { text-align: center; margin-top: 14px; font-size: 14px; }
.entry-card h2 { margin-bottom: 18px; }

lisers and steel.",earns:"Selling products like urea, polyethylene and steel at prices set largely by global markets.",watch:"Global fertiliser, petrochemical and energy prices, which can swing its profit a lot from year to year."},{ticker:"MPHC",name:"Mesaieed Petrochemical",sector:"industrials",price:1.522,change:-1.36,volume:9.4,pe:19.8,yield:4.6,about:"Holds stakes in petrochemical businesses in Mesaieed Industrial City.",earns:"Its share of profits from plants producing plastics and chemicals sold worldwide.",watch:"Petrochemical prices and feedstock costs."},{ticker:"QAMC",name:"Qatar Aluminium Manufacturing",sector:"industrials",price:1.314,change:2.1,volume:11.8,pe:12.4,yield:5.7,about:"Holds a stake in Qatalum, an aluminium smelter in Mesaieed.",earns:"Its share of profits from selling aluminium at global prices.",watch:"The global aluminium price and energy costs."},{ticker:"QEWS",name:"Qatar Electricity & Water",sector:"industrials",price:16.05,change:.31,volume:.8,pe:12.9,yield:4.9,about:"Produces a large share of Qatar\u2019s electricity and desalinated water.",earns:"Long-term agreements to sell power and water capacity.",watch:"New plant contracts and the cost of building them."},{ticker:"ORDS",name:"Ooredoo",sector:"telecoms",price:12.6,change:.64,volume:2.2,pe:10.8,yield:4.8,about:"A telecom group providing mobile, broadband and business services in Qatar and several other countries.",earns:"Monthly subscriptions, data plans and enterprise services.",watch:"Customer growth, network investment and currency moves in its international markets."},{ticker:"VFQS",name:"Vodafone Qatar",sector:"telecoms",price:2.214,change:1.47,volume:5.1,pe:15.6,yield:5.4,about:"A mobile, home broadband and business connectivity provider in Qatar.",earns:"Mobile plans, home internet and business services.",watch:"Competition for customers and the cost of network upgrades."},{ticker:"QGTS",name:"Nakilat",sector:"transport",price:4.618,change:.87,volume:7.5,pe:14.2,yield:3.4,about:"Owns and operates one of the world\u2019s largest fleets of liquefied natural gas carriers.",earns:"Chartering ships to carry LNG, often under long-term contracts.",watch:"New ship orders, financing costs and growth in Qatar\u2019s LNG exports."},{ticker:"QNNS",name:"Milaha",sector:"transport",price:11.4,change:-.52,volume:1.1,pe:11.3,yield:3.7,about:"A maritime and logistics group covering shipping, port services and offshore support.",earns:"Freight, logistics services and its investments in other companies.",watch:"Global shipping rates and regional trade volumes."},{ticker:"BRES",name:"Barwa Real Estate",sector:"realestate",price:2.861,change:.25,volume:4.4,pe:8.9,yield:6.3,about:"A real estate developer and landlord with residential and commercial property.",earns:"Rent, property sales and development projects.",watch:"Occupancy, rent levels and borrowing costs."},{ticker:"UDCD",name:"United Development Company",sector:"realestate",price:1.082,change:-.83,volume:6.9,pe:10.4,yield:4.6,about:"The master developer of The Pearl-Qatar island community.",earns:"Selling and leasing property, plus services on The Pearl.",watch:"Property demand, sales timing and debt levels."},{ticker:"BLDN",name:"Baladna",sector:"consumer",price:1.368,change:3.48,volume:12.6,pe:16.2,yield:3.1,about:"A Qatari dairy and food producer making milk, yoghurt, cheese and juices.",earns:"Selling dairy and food products in Qatar and to export markets.",watch:"Feed costs, local demand and expansion projects abroad."},{ticker:"QFLS",name:"Qatar Fuel (WOQOD)",sector:"consumer",price:15.2,change:-.2,volume:.9,pe:14.5,yield:5.9,about:"Runs Qatar\u2019s network of WOQOD fuel stations and related services.",earns:"Fuel sales, convenience stores and vehicle services.",watch:"Fuel volumes, margins and new station openings."},{ticker:"QATI",name:"Qatar Insurance",sector:"insurance",price:2.104,change:.38,volume:3.2,pe:9.8,yield:4.8,about:"An insurance group covering property, motor, medical and specialty risks.",earns:"Premiums from policies, plus returns from investing that money.",watch:"Claims, pricing discipline and investment returns."}],D={name:"QE Index",value:10520.34,change:.42},K=[{id:"start",title:"Start here",summary:"What a share is, how the QSE works and how to read a quote.",reward:"Unlocks the ranked Daily Challenge",rewardIcon:"trophy",lessons:["what-is-a-share","meet-qse","read-a-quote"]},{id:"risk-return",title:"Risk and return",summary:"Why prices swing, why spreading out helps and how time adds up.",reward:"Earns the Risk aware badge",rewardIcon:"shield",lessons:["risk","diversify","compounding"]},{id:"company",title:"Know the company",summary:"How Qatari companies make money and the numbers that describe them.",reward:"Earns the Analyst badge",rewardIcon:"search",lessons:["how-companies-earn","pe-ratio","dividends"]},{id:"habits",title:"Investor habits",summary:"Costs, opening a real account and keeping the game in perspective.",reward:"Earns the NUMU graduate badge",rewardIcon:"award",lessons:["costs","getting-started","skill-vs-luck"]}],v=[{id:"what-is-a-share",unit:"start",title:"What you own when you buy a share",minutes:4,summary:"Ownership, prices and the two ways a share can make or lose money.",cards:[{heading:"A small piece of a real business",body:"When a company lists on the Qatar Stock Exchange, its ownership is split into shares. Buy one share of QNB and you own a tiny slice of the bank, including a claim on part of its future profits."},{heading:"Why prices move",body:"A share price is the last price a buyer and a seller agreed on. It rises when more people want to buy than sell, and falls when it\u2019s the other way round. Company results, interest rates and energy prices all change what people are willing to pay.",example:"Industries Qatar sells fertilisers and petrochemicals at global prices, so its share price often reacts to commodity markets, not just news from Doha."},{heading:"Two ways to earn, one way to lose",body:"You can earn when the price rises above what you paid, or when the company pays a dividend. You can also lose: if the price falls and you sell, that loss is real. Shares come with no guarantee.",term:["Dividend","A share of company profit paid out to shareholders, usually in cash."]}],quiz:[{q:"You own 100 shares of a company. What do you actually have?",options:["A loan the company must repay","A small ownership stake in the company","A guaranteed yearly payment","A deposit protected by the bank"],answer:1,explain:"A share is part ownership. It isn\u2019t a loan, and nothing about it is guaranteed."},{q:"What sets a share\u2019s price at any moment?",options:["The company decides each morning","The government fixes it","The last price a buyer and seller agreed on","Company profit divided by 100"],answer:2,explain:"Prices come from trades. The last agreed price is what you see on a quote."}],takeaway:"A share is ownership in a business, and its price is whatever buyers and sellers agree on."},{id:"meet-qse",unit:"start",title:"Meet the Qatar Stock Exchange",minutes:4,summary:"Trading days, session times, sectors and the QE Index.",cards:[{heading:"Where Qatar\u2019s companies trade",body:"The Qatar Stock Exchange (QSE) in Doha is where shares of listed Qatari companies are bought and sold. Prices are in Qatari riyals (QAR), which are pegged to the US dollar at 3.64."},{heading:"The trading day",body:"The QSE trades Sunday to Thursday. Orders can be entered from 9:00 AM, matching starts at 9:30 AM and continuous trading runs until 1:00 PM. A closing auction then sets the official closing price at about 1:10 PM.",example:"That\u2019s why the Daily Challenge locks your picks at 9:30 AM. Once trading starts, nobody gets to pick with hindsight."},{heading:"Sectors and the QE Index",body:"Listed companies are grouped into seven sectors: banks and financial services, industrials, consumer goods and services, real estate, telecoms, transportation and insurance. The QE Index tracks 20 of the largest and most traded companies, so people use it as a quick read on the whole market.",term:["Index","A single number that tracks the combined price moves of a group of shares."]}],quiz:[{q:"On which days does the QSE trade?",options:["Monday to Friday","Sunday to Thursday","Every day of the week","Saturday to Wednesday"],answer:1,explain:"The QSE follows Qatar\u2019s working week: Sunday to Thursday."},{q:"What does the QE Index tell you?",options:["The price of one company","How 20 large, actively traded companies are doing together","Qatar\u2019s interest rate","How many people invested today"],answer:1,explain:"An index combines many companies into one number, giving a quick picture of the market."}],takeaway:"The QSE trades Sunday to Thursday, 9:30 AM to about 1:10 PM, and the QE Index is the market\u2019s headline number."},{id:"read-a-quote",unit:"start",title:"How to read a stock quote",minutes:3,summary:"Price, change, volume, daily limits and why percent beats riyals.",cards:[{heading:"The numbers on a quote",body:"A quote shows the last traded price, the change since the previous close in riyals and in percent, and the volume: how many shares changed hands today.",example:"QNBK 18.20, up 0.22 (+1.22%) means QNB last traded at QAR 18.20, 22 dirhams above yesterday\u2019s close."},{heading:"Limits and tick sizes",body:"On the QSE a share generally can\u2019t move more than 10% above or below the previous close in one session. Prices also move in fixed steps called ticks: QAR 0.01 for shares at QAR 10 and above, and QAR 0.001 below QAR 10.",example:"That\u2019s why Masraf Al Rayan shows a price like 2.364 while QNB shows 18.20."},{heading:"Percent beats riyals",body:"A 0.20 riyal move is 10% for a QAR 2 share but only about 1% for a QAR 18 share. Always compare moves in percent. The Daily Challenge scores you the same way: the average percent change of your three picks.",term:["Volume","The number of shares traded in a session. High volume means lots of buying and selling."]}],quiz:[{q:"Share A rose QAR 0.20 from QAR 2.00. Share B rose QAR 0.50 from QAR 25.00. Which did better?",options:["Share A, up 10%","Share B, because 0.50 is bigger","They did the same","You can\u2019t tell"],answer:0,explain:"A gained 10%, B gained 2%. Percent lets you compare fairly."},{q:"A share closed at QAR 10.00 yesterday. Roughly what\u2019s the highest it can trade today?",options:["QAR 10.50","QAR 11.00","QAR 15.00","There\u2019s no limit"],answer:1,explain:"The daily limit is about 10% from the previous close, so roughly QAR 11.00."}],takeaway:"Read the price, the percent change and the volume, and compare shares in percent, not riyals."},{id:"risk",unit:"risk-return",title:"Risk you can explain",minutes:4,summary:"Risk is more than prices going up and down.",cards:[{heading:"Risk is more than ups and downs",body:"Risk includes losing money, needing cash when prices are low, having too much in one company, and inflation slowly eating what your money can buy."},{heading:"Time changes everything",body:"A 10% drop feels very different if you need the money next month than if you\u2019re investing for ten years. The shorter your timeline, the less price swings you can afford.",example:"Money for next month\u2019s rent shouldn\u2019t be in shares. Savings you won\u2019t touch for years can ride out bad months."},{heading:"Return and risk travel together",body:"Investments that can rise more can usually fall more. If someone promises high returns with no risk, treat it as a red flag.",term:["Volatility","How much and how often a price swings. More volatile means bigger moves both ways."]}],quiz:[{q:"Who is most exposed to a short-term price drop?",options:["Someone saving for a house deposit due next month","Someone investing for retirement in 25 years","Both equally","Neither"],answer:0,explain:"If you need the money soon, you may have to sell after a drop and lock in the loss."},{q:"Someone promises 30% a year with no risk. What should you think?",options:["Great deal, sign up","Red flag: higher returns come with more risk","Normal for Qatar","Fine if it\u2019s a bank"],answer:1,explain:"High return with no risk doesn\u2019t exist. Promises like that are a common sign of a scam."}],takeaway:"Describe what could go wrong in plain words, then ask what it would mean for your own plans."},{id:"diversify",unit:"risk-return",title:"Don\u2019t let one sector decide your day",minutes:4,summary:"Why three banks is closer to one bet than three.",cards:[{heading:"Spreading out",body:"Diversification means owning different things that don\u2019t all depend on the same news. If one company has a bad day, the others can soften the blow."},{heading:"Same sector, same mood",body:"Qatari banks often move together because they share the same drivers: interest rates, government spending and loan demand. Owning QNB, QIB and Commercial Bank is closer to one bet than three."},{heading:"Mix the drivers",body:"Pair a bank with an industrial and a telecom and one bad sector day hurts less. Diversification lowers concentration risk, but it can\u2019t protect you when the whole market falls.",example:"In the Daily Challenge, picks from three different sectors earn a +10 Spread it out bonus."}],quiz:[{q:"Which set of picks is the most diversified?",options:["QNBK, QIBK, CBQK","QNBK, IQCD, ORDS","IQCD, MPHC, QAMC","BRES, UDCD, QNBK"],answer:1,explain:"A bank, an industrial and a telecom have different drivers. The others are mostly one sector."},{q:"What can diversification not do?",options:["Reduce reliance on one company","Spread risk across sectors","Protect you when the whole market falls","Lower concentration"],answer:2,explain:"When the whole market drops, most shares drop with it. That\u2019s market risk."}],takeaway:"Count different sources of risk, not just the number of shares you own."},{id:"compounding",unit:"risk-return",title:"Let time do some of the work",minutes:3,summary:"How reinvested returns build on themselves.",cards:[{heading:"Returns on returns",body:"Compounding happens when returns stay invested and earn returns of their own. QAR 1,000 growing 5% becomes QAR 1,050 after a year. Another 5% on that new balance makes QAR 1,102.50."},{heading:"Dividends can compound too",body:"Reinvesting dividends to buy more shares means next year\u2019s dividend is paid on a bigger holding."},{heading:"Read the fine print",body:"Those examples assume a steady return, no costs and no withdrawals. Real markets don\u2019t move in a straight line, and the rates here are illustrations, not forecasts.",term:["Compounding","Earning returns on your earlier returns, not just on the money you put in."]}],quiz:[{q:"QAR 1,000 grows 10% a year for two years, reinvested. What\u2019s it worth?",options:["QAR 1,200","QAR 1,210","QAR 1,100","QAR 1,020"],answer:1,explain:"1,000 \u2192 1,100 after year one, then 10% of 1,100 brings it to 1,210."},{q:"What helps compounding most?",options:["Time and reinvesting returns","Trading every day","Owning a single stock","Withdrawing gains each year"],answer:0,explain:"The longer returns stay invested, the more they can build on themselves."}],takeaway:"Time and reinvesting do the heavy lifting, but growth is never guaranteed."},{id:"how-companies-earn",unit:"company",title:"How Qatari companies make money",minutes:4,summary:"Banks, industrials, telecoms and shippers earn in very different ways.",cards:[{heading:"Banks",body:"Conventional banks earn interest on loans and pay less on deposits. Islamic banks like QIB and Masraf Al Rayan use Sharia-compliant structures, earning a profit on asset-based deals instead of interest. Both earn fees too."},{heading:"Industrials",body:"Industries Qatar, Mesaieed Petrochemical and Qatar Aluminium sell products at global prices. When fertiliser, plastic or aluminium prices move, their profits can swing a lot."},{heading:"Subscriptions and contracts",body:"Ooredoo and Vodafone Qatar earn monthly subscriptions. Nakilat charters LNG ships under long-term contracts. Agreed revenue years ahead tends to make profits steadier.",term:["Revenue","All the money a company brings in from sales, before costs."]}],quiz:[{q:"Industries Qatar\u2019s profit is most sensitive to\u2026",options:["Global commodity prices","Mobile subscriptions","Home rents in Lusail","Insurance claims"],answer:0,explain:"It sells fertilisers, petrochemicals and steel at prices set by global markets."},{q:"Why can long-term contracts make revenue steadier?",options:["Prices and volumes are agreed years ahead","The government fixes the share price","The company has no costs","The company can\u2019t lose money"],answer:0,explain:"Agreed contracts reduce surprises in revenue, though costs and risks remain."}],takeaway:"Know what drives a company\u2019s money before you guess where its price is going."},{id:"pe-ratio",unit:"company",title:"Is it cheap? Meet the P/E ratio",minutes:3,summary:"What you pay for each riyal of profit.",cards:[{heading:"Price \xF7 earnings",body:"The price-to-earnings ratio divides the share price by the company\u2019s yearly profit per share. A share at QAR 18 earning QAR 1.80 per share has a P/E of 10: you pay 10 riyals for every riyal of yearly profit."},{heading:"Low isn\u2019t always cheap",body:"A low P/E can mean a bargain, or it can mean the market expects profits to fall. A high P/E can mean expected growth, or excitement that may fade."},{heading:"Compare like with like",body:"Banks usually trade on lower P/Es than fast-growing companies. Compare a bank with other banks, not with a dairy company.",term:["Earnings per share","A company\u2019s yearly profit divided by its number of shares."]}],quiz:[{q:"Price QAR 12, earnings per share QAR 1.50. What\u2019s the P/E?",options:["8","18","1.5","12"],answer:0,explain:"12 \xF7 1.5 = 8."},{q:"What\u2019s the best way to use P/E?",options:["Compare companies in the same sector","Always buy the lowest P/E","Compare a bank with a telecom","Ignore earnings"],answer:0,explain:"Different sectors have different normal P/E ranges."}],takeaway:"P/E tells you what you pay for profit. Compare within a sector and ask why it\u2019s high or low."},{id:"dividends",unit:"company",title:"Dividends in Qatar",minutes:4,summary:"Payouts, yield and what a high yield might be telling you.",cards:[{heading:"Cash back to owners",body:"Many QSE companies pay cash dividends, most often once a year after their annual results are approved early in the year. Some also pay an interim dividend mid-year."},{heading:"Dividend yield",body:"Yield is the yearly dividend divided by the share price. A QAR 0.70 dividend on a QAR 14 share is a 5% yield. You need to own the shares by the cut-off date set for that dividend to receive it."},{heading:"When a high yield is a warning",body:"If a price falls sharply, the yield jumps even though nothing improved. Check whether profits can keep paying that dividend before treating a high yield as a gift.",term:["Dividend yield","Yearly dividend \xF7 share price, shown as a percent."]}],quiz:[{q:"Dividend QAR 0.50, price QAR 10. What\u2019s the yield?",options:["5%","0.5%","50%","20%"],answer:0,explain:"0.50 \xF7 10 = 0.05, or 5%."},{q:"A yield jumped because the price fell sharply. What should you check?",options:["Whether profits can keep paying the dividend","Nothing, a high yield is always good","The colour of the chart","The exchange\u2019s opening time"],answer:0,explain:"A dividend is only as safe as the profits behind it."}],takeaway:"Yield is dividend \xF7 price. Make sure profits can keep paying it."},{id:"costs",unit:"habits",title:"What it costs to trade",minutes:3,summary:"Commissions, minimum fees and settlement.",cards:[{heading:"Commission",body:"Brokers charge a commission each time you buy or sell. On the QSE the standard rate is about 0.275% of the trade value, so a QAR 10,000 purchase costs about QAR 27.50."},{heading:"Small trades and frequent trades",body:"Brokers can set a minimum fee per trade, so very small trades can cost much more in percent terms. Trading in and out often adds costs on both sides every time."},{heading:"Settlement",body:"The QSE settles trades on T+2: cash and shares change hands two business days after the trade. Buy on Sunday and it settles on Tuesday.",term:["Settlement","When the shares and cash actually change hands after a trade."]}],quiz:[{q:"What\u2019s 0.275% commission on a QAR 10,000 purchase?",options:["QAR 27.50","QAR 2.75","QAR 275","QAR 0.275"],answer:0,explain:"10,000 \xD7 0.00275 = 27.50."},{q:"You buy on Sunday. With T+2, when does it settle?",options:["Tuesday","Sunday","Monday","Thursday"],answer:0,explain:"Two business days after Sunday is Tuesday."}],takeaway:"Costs come on every trade. Fewer, bigger, well-reasoned trades usually cost less."},{id:"getting-started",unit:"habits",title:"From practice to a real account",minutes:4,summary:"The NIN, brokers and a plan before your first real trade.",cards:[{heading:"Your National Investor Number",body:"To own QSE shares you need a National Investor Number (NIN) from Qatar\u2019s central securities depository. You can apply directly or through a licensed broker, usually with your ID and a letter or stamp from your Qatari bank."},{heading:"A trading account",body:"With a NIN, you open a trading account with a licensed broker and place orders through their app or branch. Rules can differ for non-Qatari investors, so check what applies to you before you start."},{heading:"Start with a plan",body:"Keep an emergency fund first, only invest money you won\u2019t need soon, and keep each position small enough that one mistake won\u2019t hurt much.",example:"NUMU is for learning. It never places real trades or holds your money."}],quiz:[{q:"What do you need before a broker can trade QSE shares for you?",options:["A National Investor Number (NIN)","A QE Index licence","A NUMU badge","Nothing at all"],answer:0,explain:"The NIN identifies you a
